<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
  <meta charset="UTF-8">
  <title>Local Accounting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- nav bar -->
  <div class="drawer">
    <input id="my-drawer-1" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content">

      <!-- Page content here -->
      <label for="my-drawer-1" class="btn drawer-button">Open drawer</label>
      
      <!-- main content -->
      <div class="max-w-7xl grid place-content-center">
        <div id="summary"></div>

        <form id="expenseForm" class="grid grid-cols-4">
          <input type="text" id="description" placeholder="pasta" required class="input col-span-1"/>
          <input type="number" id="amount" placeholder="980" required class="input col-span-1"/>
          <select class="select col-span-1">
            <option disabled selected>category</option>
            <option>food</option>
            <option>medical</option>
            <option>investment</option>
          </select>
          <button class="btn col-span-1">add</button>
        </form>

        <ul id="expenseList"></ul>
      </div>

    </div>
    <div class="drawer-side">
      <label for="my-drawer-1" aria-label="close sidebar" class="drawer-overlay"></label>
      <ul class="menu bg-base-200 min-h-full w-80 p-4">
        <!-- Sidebar content here -->
        <li><a>Main</a></li>
        <li><a>Charts</a></li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
