<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <title>Turbo Accounting</title>
  <link rel="stylesheet" href="style.css">
  <script src="/js/chart.js"></script>
</head>
<body>
  <!-- nav bar -->
  <div class="drawer">
    <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content">

      <!-- content area -->
      <div class="min-h-screen flex flex-col">

        <!-- header  -->
        <header class="bg-base-100 mb-6 border-b-2 border-base-300 sticky top-0 z-10">
          <!-- menu button -->
          <label for="sidebar-drawer" class="drawer-button m-2 absolute">
            <i class="bi bi-list text-3xl"></i>
          </label>

          <p class="text-3xl m-2 text-center">TURBO ACCOUNTING</p>
        </header>

        <!-- ============= -->
        <!-- THE MAIN PAGE -->
        <!-- ============= -->
        <div id="home" class="hidden target:block grow">
          <div class="content-container">

            <!-- layout grid -->
            <div class="flex flex-col md:flex-row">

              <!-- input form & table -->
              <div class="bg-base-100 h-auto m-1 grow">

                <!-- page month selector -->
                <div>
                  <button id="buttonLastMonth" class="btn"><i class="bi bi-arrow-left"></i></button>
                  <label class="select w-auto">
                    <span class="label">Year</span>
                    <select id="pageYearSelector">
                    </select>
                  </label>
                  <label class="select w-auto">
                    <span class="label">Month</span>
                    <select id="pageMonthSelector">
                    </select>
                  </label>
                  <button id="buttonGoToMonth" class="btn">GO</button>
                  <button id="buttonNextMonth" class="btn"><i class="bi bi-arrow-right"></i></button>
                </div>

                <div class="divider"></div>

                <!-- form -->
                <form id="expenseForm" class="flex flex-row gap-x-1 mb-1">
                  <label class="input">
                    <span class="label">Date</span>
                    <input id="date" type="date" />
                  </label>
                  <input type="text" id="description" placeholder="pasta" class="input"/>
                  <input type="number" id="amount" placeholder="980" required class="input"/>
                  <select id="category" class="select">
                    <!-- categories will be automatically populated by js -->
                    <option disabled selected>Category</option>
                  </select>
                  <button class="btn">ADD</button>
                </form>

                <!-- table of expense  data -->
                <div class="overflow-x-auto grow mb-1">
                  <table id="expenseTable" class="table table-zebra">
                    <!-- head (will be replaced by js) -->
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Category</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>

              </div>
              
              <div class="divider sm:divider-horizontal"></div>

              <!-- charts -->
              <div class="flex flex-col md:max-w-md">
                
                <!-- stats -->
                <div class="stats bg-base-100 border-base-300 border shadow-sm">
                  <div class="stat">
                    <div class="stat-title">Total Income</div>
                    <div class="stat-value">$3,200</div>
                  </div>

                  <div class="stat">
                    <div class="stat-title">Spent</div>
                    <div class="stat-value">$2,800</div>
                  </div>

                  <div class="stat">
                    <div class="stat-title">Remaining</div>
                    <div class="stat-value">$400</div>
                  </div>
                </div>

                <canvas id="monthlyBreakdownChartCategories" class="m-1"></canvas>
                <canvas id="monthlyBreakdownChartOverview" class="m-1"></canvas>
              </div>

            </div>
          </div>
        </div>

        <!-- ============= -->
        <!-- SETTINGS PAGE -->
        <!-- ============= -->
        <div id="settings" class="hidden target:block grow">
          <div class="content-container">

            settings page

          </div>
        </div>

        <!-- footer -->
        <footer class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4">
          <aside>
            <p>
              Made by Mika Novakovic
              <a href="https://github.com/big-nuggz"><i class="bi bi-github"></i></a>
            </p>
          </aside>
        </footer>

      </div>  
    </div>
    <div class="drawer-side z-11">
      <label for="sidebar-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
      <ul class="menu bg-base-200 min-h-full w-80 p-4">
        <!-- Sidebar content here -->
        <li><a href="#home">HOME</a></li>
        <li><a href="#settings">SETTINGS</a></li>
      </ul>
    </div>
  </div>
  
  <script type="module" src="app.js"></script>
</body>
</html>
