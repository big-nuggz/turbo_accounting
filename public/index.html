<!DOCTYPE html>
<!-- <html lang="en" data-theme="cupcake"> -->
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <title>Turbo Accounting</title>
  <link rel="stylesheet" href="style.css">
  <script src="/js/chart.js"></script>
</head>
<body>
  <!-- nav bar -->
  <div class="drawer">
    <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content">

      <!-- content area -->
      <div class="bg-base-200 min-h-screen flex flex-col">

        <!-- header  -->
        <header class="bg-primary border-b-2 border-peimary-content mb-2">
          <!-- menu button -->
          <label for="sidebar-drawer" class="drawer-button m-2 absolute">
            <i class="bi bi-list text-3xl text-primary-content"></i>
          </label>

          <p class="text-primary-content text-3xl font-bold m-2 text-center">TURBO ACCOUNTING</p>
        </header>

        <!-- ============= -->
        <!-- THE MAIN PAGE -->
        <!-- ============= -->
        <div id="main" class="hidden target:block grow">
          <div class="content-container">

            <!-- layout grid -->
            <div class="grid md:grid-cols-2 grid-cols-1">

              <!-- input form & table -->
              <div class="card col-span-1 bg-base-100 shadow-sm h-auto m-1">

                <!-- form -->
                <form id="expenseForm" class="grid grid-cols-6 mb-1">
                  <div class="col-span-2 m-1">
                    <label class="input">
                      <span class="label">Date</span>
                      <input id="date" type="date" />
                    </label>
                  </div>
                  <div class="col-span-1 my-1 mr-1">
                    <input type="text" id="description" placeholder="pasta" class="input"/>
                  </div>
                  <div class="col-span-1 my-1 mr-1">
                    <input type="number" id="amount" placeholder="980" required class="input"/>
                  </div>
                  <div class="col-span-1 my-1 mr-1">
                    <select id="category" class="select">
                      <!-- categories will be automatically populated by js -->
                      <option disabled selected>Category</option>
                    </select>
                  </div>
                  <div class="col-span-1 my-1 mr-1 flex">
                    <button class="btn grow">Add</button>
                  </div>
                </form>

                <!-- table of expense  data -->
                <div class="overflow-x-auto col-span-1 mb-1">
                  <table id="expenseTable" class="table table-zebra">
                    <!-- head (will be replaced by js) -->
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Category</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>

              </div>

              <!-- charts -->
              <div class="grid md:grid-cols-2 grid-cols-1 col-span-1">

                <div class="col-span-1 card bg-base-100 shadow-sm m-1">
                  <div class="card-body">
                    <canvas id="monthlyBreakdownChartCategories" class="w-max h-max"></canvas>
                  </div>
                </div>

                <div class="col-span-1 card bg-base-100 shadow-sm m-1">
                  <div class="card-body">
                    <canvas id="monthlyBreakdownChartOverview" class="w-max h-max"></canvas>
                  </div>
                </div>

              </div>

            </div>
          </div>
        </div>

        <!-- ============ -->
        <!-- SUMMARY PAGE -->
        <!-- ============ -->
        <div id="summary" class="hidden target:block grow">
          <div class="content-container">

            <div class="stats bg-base-100 border-base-300 border shadow-sm">
              <div class="stat">
                <div class="stat-title">Account balance</div>
                <div class="stat-value">$89,400</div>
                <div class="stat-actions">
                  <button class="btn btn-xs btn-success">Add funds</button>
                </div>
              </div>

              <div class="stat">
                <div class="stat-title">Current balance</div>
                <div class="stat-value">$89,400</div>
                <div class="stat-actions">
                  <button class="btn btn-xs">Withdrawal</button>
                  <button class="btn btn-xs">Deposit</button>
                </div>
              </div>
            </div>

            some cool charts will be here

          </div>
        </div>

        <!-- footer -->
        <footer class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4">
          <aside>
            <p>
              Made by Mika Novakovic
              <a href="https://github.com/big-nuggz"><i class="bi bi-github"></i></a>
            </p>
          </aside>
        </footer>

      </div>  
    </div>
    <div class="drawer-side">
      <label for="sidebar-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
      <ul class="menu bg-base-200 min-h-full w-80 p-4">
        <!-- Sidebar content here -->
        <li><a href="#main">Main</a></li>
        <li><a href="#summary">Annual Summary</a></li>
      </ul>
    </div>
  </div>
  
  <script src="monthlyChart.js"></script>
  <script src="app.js"></script>
</body>
</html>
